# Pulls the boards and named panel icons the Solver shared from the live-data collector (worker/), measures
# the live odds (data/live/rates.json), writes the weight changes they suggest to data/live/proposal.md,
# runs the tests, and commits the data. It changes no weights and deploys nothing: the data is reviewed
# first, and weights are applied by hand (the weights script without --propose).
# Runs every 15 minutes while data comes in fast (GitHub may run it late), or on demand:
# gh workflow run live-data.yml
# Needs the repo variable LIVE_DATA_URL and the secret LIVE_DATA_TOKEN (see worker/README.md); until the
# variable is set, the job is skipped.
name: Live data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  pull:
    if: ${{ vars.LIVE_DATA_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pull new boards and measure the live odds
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/pull.ts | tee pull.txt

      - name: Propose weight changes (not applied)
        run: npx vite-node scripts/live/weights.ts --propose | tee weights.txt

      - name: Replay real moves in the simulator (card-effect check)
        run: npx vite-node scripts/live/checkRules.ts data/live/raw | tee rules.txt

      - name: Test
        run: npm test

      - name: Commit
        run: |
          git add data/live
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo "Live data: $(head -1 pull.txt)"
            echo
            grep -v '^No weight changes' weights.txt || true
          } > message.txt
          git commit -F message.txt
          git push
