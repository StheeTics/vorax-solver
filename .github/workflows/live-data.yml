# Every hour: pulls the boards and named panel icons the Solver shared from the live-data collector (worker/),
# sends the collector's dashboard its numbers worked out from them,
# teaches the reader the icons players named (src/solver/scan/learnedIcons.json, scripts/live/mergeIcons.ts),
# measures the live odds (data/live/rates.json), and applies the odds changes the data supports, within the
# guards in scripts/live/propose.ts (30+ sightings, outside the 95% range, at most 2x per update). It replays
# the real moves in the simulator (data/live/rules-check.json), runs the tests and commits. Cards the Solver
# couldn't name come in too (data/live/cards.jsonl, a picture of each in data/live/new-cards/): each new one gets a
# GitHub issue (scripts/live/newCards.ts), so it can be added. When the odds
# changed, it notes the change in the dashboard's history; when the odds or the icons changed, it redeploys the
# site (a push made with the workflow's token starts no other workflow by itself). Or on demand:
# gh workflow run live-data.yml
# Needs the repo variable LIVE_DATA_URL and the secret LIVE_DATA_TOKEN (see worker/README.md); until the
# variable is set, the job is skipped.
name: Live data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  pull:
    if: ${{ vars.LIVE_DATA_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pull new boards and measure the live odds
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/pull.ts | tee pull.txt

      # the dashboard's numbers: too much work for the collector's free plan per request (worker/src/summary.ts)
      - name: Send the dashboard its numbers
        continue-on-error: true
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/summary.ts

      - name: List the cards the Solver couldn't name
        run: npx vite-node scripts/live/newCards.ts | tee cards.txt

      - name: Teach the reader the instrument icons players named
        run: npx vite-node scripts/live/learnIcons.ts | tee icons.txt

      - name: Apply the odds changes the live data supports
        run: npx vite-node scripts/live/weights.ts | tee weights.txt

      - name: Replay real moves in the simulator (card-effect check)
        run: npx vite-node scripts/live/checkRules.ts data/live/raw | tee rules.txt

      - name: Test
        run: npm test

      - name: Note an odds change in the dashboard's history
        run: |
          if ! git diff --quiet src/data/liveWeights.ts; then
            python3 -c "import json,sys; print(json.dumps({'date': sys.argv[1], 'change': 'Odds updated from live data: ' + sys.argv[2]}))" "$(date -u +%Y-%m-%d)" "$(head -1 weights.txt)" >> data/live/history.jsonl
          fi

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          odds=$(git diff --quiet src/data/liveWeights.ts || echo changed)
          icons=$(git diff --quiet src/solver/scan/learnedIcons.json || echo changed)
          git add data/live src/data/liveWeights.ts src/solver/scan/learnedIcons.json
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo "Live data: $(head -1 pull.txt)"
            echo
            grep -v '^No weight changes' weights.txt || true
            grep -v '^No learned icons' icons.txt || true
          } > message.txt
          git commit -F message.txt
          git pull --rebase
          git push
          # new odds or new icons: redeploy
          if [ -n "$odds" ] || [ -n "$icons" ]; then gh workflow run deploy.yml; fi

      # off while cards cut off mid-slide or under a hover are shared as new ones (Oct 21)
      - name: Open an issue for each new card
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx vite-node scripts/live/newCards.ts --issues
