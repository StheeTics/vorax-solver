# Every 2 hours: pulls the boards shared since the last nightly commit from the live-data collector (worker/) and
# sends the collector's dashboard its numbers worked out from every board (scripts/live/summary.ts). Nothing is
# committed: the odds, icons and tests stay with the nightly jobs on the PC (scripts/nightly.sh). Started by the
# collector's cron trigger (worker/src/schedule.ts), with the schedule here as a backup. Or on demand:
# gh workflow run dashboard.yml
# Needs the repo variable LIVE_DATA_URL and the secret LIVE_DATA_TOKEN (see worker/README.md); until the
# variable is set, the job is skipped.
name: Dashboard numbers

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  summary:
    if: ${{ vars.LIVE_DATA_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Pull the boards shared since the last nightly commit
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/pull.ts

      - name: Send the dashboard its numbers
        env:
          LIVE_DATA_URL: ${{ vars.LIVE_DATA_URL }}
          LIVE_DATA_TOKEN: ${{ secrets.LIVE_DATA_TOKEN }}
        run: npx vite-node scripts/live/summary.ts
