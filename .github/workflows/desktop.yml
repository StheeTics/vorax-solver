# Builds Vorax Overlay (desktop/) for Windows and publishes it as a GitHub Release, when a desktop-v* tag
# is pushed. Installed copies update themselves from these releases (electron-updater reads latest.yml).
# To release: bump "version" in desktop/package.json, commit, then
#   git tag -a desktop-v0.1.0 -m "Vorax Overlay 0.1.0" && git push origin desktop-v0.1.0
name: Desktop app

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="desktop-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)"; exit 1; }

      - name: Create the release (electron-builder alone can create it twice and lose files)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Vorax Overlay ${GITHUB_REF_NAME#desktop-v}" --notes "Download **Vorax-Overlay-Setup-${GITHUB_REF_NAME#desktop-v}.exe** below and run it. Windows may say \"Windows protected your PC\" the first time (the app isn't code-signed): click More info, then Run anyway. Installed copies update themselves."

      - name: Build and upload the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dist' }}

      - name: Keep the installer (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Vorax-Overlay-Setup
          path: desktop/dist/*.exe
