<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<title>Vorax Overlay</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Stencil+Display:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* The site's colours (src/styles/tokens.css), for a card over the game. */
  :root {
    --bg-0: #0b0506;
    --bg-1: #1d0a0c;
    --bg-2: #2a1014;
    --iron: #2b2a2e;
    --iron-hi: #55535a;
    --gold: #e3b25a;
    --gold-hi: #ffd98a;
    --gold-lo: #8a5e22;
    --text: #f1e9e2;
    --text-dim: #b8aba3;
    --text-faint: #7d716b;
    --keyword: #ff5b5b;
    /* Tartarus Overlay's fonts, so the two cards read alike */
    --font-display: 'Big Shoulders Stencil Display', 'Arial Narrow', Impact, sans-serif;
    --font-body: 'Barlow Semi Condensed', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --radius: 6px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  body {
    color: var(--text);
    font: 14px/1.35 var(--font-body);
  }

  .card {
    border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--iron));
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--bg-0) 92%, transparent);
    overflow: hidden;
  }

  /* sizes as Tartarus Overlay's card, so the two look alike */
  .head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px 5px 10px;
    border-bottom: 1px solid var(--iron);
    background: color-mix(in srgb, var(--bg-2) 90%, transparent);
    -webkit-app-region: drag;
    cursor: move;
  }

  .brand {
    color: var(--gold);
    font: 800 15px/1 var(--font-display);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .sep {
    color: var(--iron-hi);
    font-size: 13px;
  }

  .status {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    color: var(--text-dim);
    font: 500 11.5px/1.2 var(--font-mono);
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .head button {
    -webkit-app-region: no-drag;
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    padding: 0;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: var(--text-dim);
    font: 600 14px/1 var(--font-body);
    cursor: pointer;
  }

  .head button:hover,
  .head button:focus-visible {
    background: var(--bg-1);
    color: var(--gold-hi);
  }

  .body { padding: 8px 10px 9px; }

  .eyebrow {
    margin: 0 0 2px;
    color: var(--gold);
    font: 500 10.5px/1.2 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .move {
    margin: 0 0 4px;
    color: var(--gold-hi);
    font: 700 21px/1.15 var(--font-body);
    text-wrap: balance;
  }

  .detail {
    margin: 0;
    color: var(--text);
    font-size: 13px;
  }

  .others {
    margin: 6px 0 0;
    padding: 6px 0 0;
    border-top: 1px solid var(--iron);
    list-style: none;
    color: var(--text-dim);
    font-size: 12px;
  }

  .others li + li { margin-top: 2px; }

  .updating .move,
  .updating .detail,
  .updating .others { opacity: 0.55; }

  .update {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 0;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--bg-1);
    color: var(--text-dim);
    font-size: 12px;
  }

  .update span { flex: 1; }

  /* the Solver window's question (which instrument was taken): the window is hidden, so it's asked here */
  .ask {
    border: 1px solid var(--gold-lo);
    color: var(--text);
  }

  /* the instrument question, answered right here: one button per instrument offered */
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0 0;
  }

  .choices button {
    flex: 1 1 auto;
    padding: 5px 8px;
    border: 1px solid var(--gold);
    border-radius: 5px;
    background: var(--gold-lo);
    color: var(--gold-hi);
    font: 600 12px var(--font-body);
    cursor: pointer;
  }

  .choices button:hover,
  .choices button:focus-visible {
    background: var(--gold);
    color: var(--bg-0);
  }

  /* one message per line, the most pressing first */
  .ask-line {
    display: block;
  }

  .ask-line + .ask-line {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid var(--iron);
  }

  .update button {
    padding: 3px 10px;
    border: 1px solid var(--gold);
    border-radius: 5px;
    background: var(--gold-lo);
    color: var(--gold-hi);
    font: 600 12px var(--font-body);
    cursor: pointer;
  }

  .update button:hover,
  .update button:focus-visible {
    background: var(--gold);
    color: var(--bg-0);
  }

  .foot {
    display: flex;
    gap: 6px;
    margin: 8px 0 0;
  }

  .foot button {
    padding: 2px 9px;
    border: 1px solid var(--iron-hi);
    border-radius: 5px;
    background: transparent;
    color: var(--text-dim);
    font: 500 11.5px var(--font-body);
    cursor: pointer;
  }

  .foot button:hover,
  .foot button:focus-visible {
    border-color: var(--gold);
    color: var(--gold-hi);
  }

  /* folded to a thin bar: Tartarus Overlay's folded sizes */
  .folded .body { display: none; }

  .folded .head {
    gap: 6px;
    padding: 1px 2px 1px 7px;
    border-bottom: 0;
  }

  .folded .brand { font-size: 12px; }

  .folded .sep { font-size: 11px; }

  .folded .status {
    color: var(--gold-hi);
    font: 600 12.5px/16px var(--font-body);
  }

  .folded .head button {
    width: 16px;
    height: 16px;
    font-size: 12px;
  }

  /* paused: the move says what to fix, in red */
  .paused .eyebrow,
  .paused .move { color: var(--keyword); }

  /* advice shown anyway, though it can't be trusted */
  .warning {
    margin: 0 0 6px;
    padding: 4px 8px;
    border: 1px solid var(--keyword);
    border-radius: 5px;
    background: color-mix(in srgb, var(--keyword) 16%, transparent);
    color: #ffd6d6;
    font: 600 12px/1.3 var(--font-body);
  }

  /* on the paused card's "fix it in the Solver" line */
  .update .force-button {
    border-color: var(--keyword);
    background: color-mix(in srgb, var(--keyword) 22%, transparent);
    color: #ffd6d6;
  }

  .update .force-button:hover,
  .update .force-button:focus-visible {
    background: var(--keyword);
    color: #fff;
  }

  /* Buy me a coffee, each time the app starts: a quiet line, hidden with its button */
  .support {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 8px 0 0;
    padding: 3px 4px 3px 10px;
    border-radius: 6px;
    background: var(--bg-1);
    color: var(--text-dim);
    font-size: 12px;
  }

  .support span { flex: 1; }

  .support button {
    padding: 3px 10px;
    border: 1px solid var(--gold-lo);
    border-radius: 5px;
    background: transparent;
    color: var(--gold);
    font: 500 12.5px var(--font-body);
    cursor: pointer;
  }

  .support button:hover,
  .support button:focus-visible {
    border-color: var(--gold);
    color: var(--gold-hi);
  }

  .support .support-close {
    padding: 3px 10px;
    border: 1px solid var(--keyword);
    background: color-mix(in srgb, var(--keyword) 22%, transparent);
    color: #ffd6d6;
    font: 600 12.5px var(--font-body);
  }

  .support .support-close:hover,
  .support .support-close:focus-visible {
    border-color: var(--keyword);
    background: var(--keyword);
    color: #fff;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <span class="brand">Vorax</span>
      <span class="sep" aria-hidden="true">|</span>
      <span class="status" id="status">Waiting for the game</span>
      <button type="button" id="fold" title="Fold it to a thin bar" aria-label="Fold" aria-pressed="false">–</button>
    </div>
    <div class="body">
      <p class="warning" id="warning" hidden></p>
      <p class="eyebrow" id="eyebrow">Next move</p>
      <p class="move" id="move">Waiting for the cards…</p>
      <p class="detail" id="detail" hidden></p>
      <ul class="others" id="others" hidden></ul>
      <div class="update ask" id="ask" hidden>
        <span id="ask-text"></span>
        <button type="button" id="ask-button">Show me</button>
        <button type="button" class="force-button" id="force-button" title="Not reliable: the moves may be wrong" hidden>Show advice anyway</button>
      </div>
      <div class="choices" id="choices" role="group" aria-label="Which instrument did you take?" hidden></div>
      <div class="update" id="update" hidden>
        <span id="update-text"></span>
        <button type="button" id="update-button"></button>
      </div>
      <div class="support" id="support" hidden>
        <span>Enjoying the Solver?</span>
        <button type="button" class="support-close" id="support-close" title="Hide this message">Hide this</button>
        <button type="button" id="support-open">☕ Buy me a coffee</button>
      </div>
      <div class="foot">
        <button type="button" id="solver" title="Show or hide the Solver (Ctrl+Alt+S)">Solver</button>
        <button type="button" id="snap" title="Take a picture of the game now and read it (Ctrl+Alt+X)">Picture</button>
      </div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
