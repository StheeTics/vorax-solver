<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Vorax highlights</title>
<style>
  /* Laid exactly over the game's picture, see-through and click-through: only the boxes show. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .box {
    position: absolute;
    box-sizing: border-box;
    border: 4px solid #3ddc84;
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(61, 220, 132, 0.8), inset 0 0 12px rgba(61, 220, 132, 0.45);
  }
</style>
</head>
<body>
  <script src="highlight.js"></script>
</body>
</html>
